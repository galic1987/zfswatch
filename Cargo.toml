[workspace]
members = [
    "crates/zfswatch-core",
    "crates/zfswatch-zfs",
    "crates/zfswatch-platform",
    "crates/zfswatch-keys",
    "crates/zfswatchd",
    "crates/zfswatch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["zfswatch contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/zfswatch"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Password input
rpassword = "7.3"

# Async traits
async-trait = "0.1"

# Secure memory
zeroize = { version = "1.8", features = ["derive", "alloc"] }

# IPC / communication
tonic = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.16", features = ["v4", "serde"] }

# Internal crates
zfswatch-core = { path = "crates/zfswatch-core" }
zfswatch-zfs = { path = "crates/zfswatch-zfs" }
zfswatch-platform = { path = "crates/zfswatch-platform" }
zfswatch-keys = { path = "crates/zfswatch-keys" }
